name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "docker-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      image_variant:
        description: "Which image variant to build"
        type: choice
        options:
          - all
          - standard
          - battlemage
          - preview-nightly
        default: "all"
      additional_tag:
        description: "Additional tag to apply (optional)"
        type: string
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-standard:
    name: Build Standard Image
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.image_variant == 'all' ||
      inputs.image_variant == 'standard'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-standard
            type=ref,event=pr,suffix=-standard
            type=semver,pattern={{version}},suffix=-standard
            type=raw,value=latest-standard,enable={{is_default_branch}}
            type=raw,value=${{ inputs.additional_tag }},enable=${{ inputs.additional_tag != '' }}
            type=sha,suffix=-standard

      - name: Build and push Standard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-battlemage:
    name: Build Battlemage Image
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.image_variant == 'all' ||
      inputs.image_variant == 'battlemage'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-battlemage
            type=ref,event=pr,suffix=-battlemage
            type=semver,pattern={{version}},suffix=-battlemage
            type=raw,value=latest-battlemage,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.additional_tag }},enable=${{ inputs.additional_tag != '' }}
            type=sha,suffix=-battlemage

      - name: Build and push Battlemage image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Battlemage.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-preview-nightly:
    name: Build Preview Nightly Image (from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.image_variant == 'all' ||
      inputs.image_variant == 'preview-nightly'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-preview-nightly
            type=ref,event=pr,suffix=-preview-nightly
            type=raw,value=preview-nightly,enable={{is_default_branch}}
            type=raw,value=${{ inputs.additional_tag }},enable=${{ inputs.additional_tag != '' }}
            type=sha,suffix=-preview-nightly

      - name: Build and push Preview Nightly image
        uses: docker/build-push-action@v5
        with:
          context: ./docker_preview
          file: ./docker_preview/Battlemage.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
